general.import = [
  "~/.config/alacritty/catppuccin-mocha.toml"
]

[window]
decorations = "None"

[mouse]
hide_when_typing = true

[cursor]
style = { shape = "Block", blinking = "Always" }

[font]
size = 12.0

[font.normal]
family = "Monaspace Argon Var"
style = "Regular"

[font.bold]
family = "Monaspace Argon Var"
style = "Bold"

[font.italic]
family = "Monaspace Argon Var"
style = "Italic"

